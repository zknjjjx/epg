name: Build & Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'update.mjs'
      - 'server.mjs'
      - 'worker.js'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/epg:latest
            ghcr.io/${{ github.repository_owner }}/epg:${{ github.sha }}
