services:
  epg:
    image: ghcr.io/zknjjjx/epg:latest
    container_name: epg
    restart: unless-stopped
    network_mode: host   # 软路由/NAS 推荐 host 模式：与主机共用网络，走相同的代理/分流规则
    volumes:
      - ./data:/data
    environment:
      - ADMIN_PASSWORD=changeme   # 改成你自己的管理密码
      # - EPG_SOURCES=            # 可选：自定义数据源，一行一个 "名称|URL|优先级"
      # - UPDATE_CRON=daily       # daily=每天01:00更新，或填分钟数如 720
